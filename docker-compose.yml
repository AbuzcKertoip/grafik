
services:
  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    volumes:
      # Persist the SQLite database file
      - ./prisma/dev.db:/app/prisma/dev.db
    environment:
      # Ensure the app connects to the mounted DB file
      - DATABASE_URL="file:./dev.db"
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
