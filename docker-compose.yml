
services:
  app:
    build: .
    restart: always
    ports:
      - "80:3000"
    volumes:
      # Persist the SQLite database file
      - ./data:/app/prisma/data
    environment:
      # Database path (absolute, inside the container)
      - DATABASE_URL=file:/app/prisma/data/dev.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
